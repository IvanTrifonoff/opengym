name: CI

# Автоматический CI на каждый push/PR в ветку dev:
# строит frontend + api и гоняет автотесты. Результат — сигнал "dev готов к проверке",
# но НЕ деплой: выпуск на прод делается вручную через отдельный workflow (CD).
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            api/package-lock.json

      - name: Install deps (frontend)
        working-directory: frontend
        run: npm ci

      - name: Install deps (api)
        working-directory: api
        run: npm ci || npm install

      - name: Test frontend (vitest)
        working-directory: frontend
        run: npm test -- --reporter=dot

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Node syntax API
        working-directory: api
        run: node --check server.js

      - name: Health-check bootstrap smoke
        run: echo "✓ CI build+test прошёл на $(date --iso-8601=seconds)"