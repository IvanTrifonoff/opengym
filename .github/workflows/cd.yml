name: CD — deploy to prod (manual)

# Ручной деплой на прод impulse.trfnv.ru ТОЛЬКО по твоей команде.
# Запуск: GitHub → Actions → "CD — deploy to prod" → Run workflow → выбери git-ref.
# Только проверенные релизы: обычно tag vX.Y.Z из main (см. VERSIONING.md).
on:
  workflow_dispatch:
    inputs:
      app_ref:
        description: "git-ref для деплоя (тег vX.Y.Z или ветка main)"
        required: true
        default: main
      seed_data_from:
        description: "SSH-источник для переноса data/ (vapid.json/secret), пусто = чистый прод"
        required: false
        default: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail
            export SEED_DATA_FROM=${{ inputs.seed_data_from }}
            bash /opt/opengym-prod/deploy/bootstrap.sh ${{ secrets.PROD_DOMAIN }} ${{ inputs.app_ref }}

      - name: Smoke check
        run: |
          sleep 10
          curl -fsS "https://${{ secrets.PROD_DOMAIN }}/api/health" && echo " ✓ prod healthy" || exit 1