name: opengym-prod

# Самодостаточный прод-стек для impulse.trfnv.ru.
# db + redis + api + web в одной внутренней сети; наружу через nginx → web (127.0.0.1:8180).
# В отличие от root docker-compose.yml (дев, внешний postgres), здесь БД/кеш — часть стека.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opengym}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-opengym}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opengym} -d ${POSTGRES_DB:-opengym}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 1g

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 256m

  media:
    image: alpine/git
    volumes:
      - ./media/img:/out/img
      - ./media/gif:/out/gif
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$(ls -A /out/img 2>/dev/null)" ]; then
          echo "↓ Exercise media scan… (media также уже закоммичены в репозитории)"
        fi
    restart: "no"

  api:
    image: ghcr.io/duartesantos8/opengym-api:latest
    build: ./api
    restart: unless-stopped
    env_file: .env
    dns:
      - 8.8.4.4
      - 1.1.1.1
    environment:
      - PORT=3000
      - DATA_DIR=/data
      - DATABASE_URL=postgresql://${POSTGRES_USER:-opengym}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-opengym}?sslmode=disable
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    image: ghcr.io/duartesantos8/opengym-web:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      media:
        condition: service_completed_successfully
      api:
        condition: service_started
    ports:
      - "${WEB_PORT:-127.0.0.1:8180}:80"
    volumes:
      - ./media/img:/usr/share/nginx/html/img:ro
      - ./media/gif:/usr/share/nginx/html/gif:ro

volumes:
  pgdata:
  redisdata: